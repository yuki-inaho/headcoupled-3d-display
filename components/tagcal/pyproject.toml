[project]
name = "apriltag-calibrator"
version = "0.1.0"
description = "AprilTag grid camera intrinsic calibration tool with automatic keyframe selection"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
authors = [
  { name = "tagcal contributors" },
]
keywords = ["camera", "calibration", "apriltag", "opencv", "computer-vision"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
  "numpy>=2.0,<3",
  "opencv-contrib-python>=4.10,<5",
  "pillow>=10.4,<13",
  "pyyaml>=6.0,<7",
  "reportlab>=4.2,<5",
  "rich>=13.9,<15",
  "typer>=0.15,<1",
]

[project.optional-dependencies]
gui = [
  "pyside6>=6.8,<7",
]
dev = [
  "pytest>=8.3,<10",
  "ruff>=0.9,<1",
  "ty>=0.0.72",
  "types-pyyaml>=6.0,<7",
]

[project.scripts]
tagcal = "tagcal.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tagcal"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# RUF001: Japanese UI strings intentionally use fullwidth punctuation and "×".
ignore = ["E501", "RUF001"]

[tool.ruff.lint.per-file-ignores]
"src/tagcal/gui.py" = ["N802"]

[tool.ty.environment]
# Checked against the lowest supported interpreter declared in requires-python.
python-version = "3.11"

[tool.ty.src]
include = ["src", "tests"]
