[project]
name = "headcoupled-3d-display"
version = "0.1.0"
description = "Calibrated head-coupled 3D point-cloud display with synthetic and FaceMesh tracking backends"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [{ name = "Head-Coupled Display contributors" }]
dependencies = [
  "beartype>=0.22,<1",
  "fastapi>=0.115,<1",
  "jaxtyping>=0.3,<1",
  "uvicorn>=0.32,<1",
  # uvicorn ships no WebSocket implementation of its own; /ws/pose and /ws/camera
  # are silently unavailable without it.
  "websockets>=13,<18",
  "numpy>=1.26,<3",
  "scipy>=1.11,<2",
  "opencv-python>=4.9,<5",
  "pydantic>=2.9,<3",
  "PyYAML>=6,<7",
  "typer>=0.15,<1",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "pytest==9.0.2",
  "playwright==1.57.0",
  "radon>=6,<7",
  "ruff==0.15.4",
]

[project.scripts]
headcoupled = "headcoupled_display.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/headcoupled_display"]

[tool.hatch.build]
include = [
  "src/headcoupled_display/static/**/*",
  "src/headcoupled_display/resources/**/*",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = [
  "e2e: browser end-to-end test",
  # Deliberately a separate marker from `e2e`: this one needs a CUDA GPU, the recording,
  # the personal mesh and the tagcal intrinsics. Mixing it into `e2e` would make an
  # ordinary CI run either fail for want of hardware or skip silently and look green.
  "recorded_cuda: end-to-end run of the recording through real CUDA FaceMesh inference",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C90", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.mccabe]
max-complexity = 10
